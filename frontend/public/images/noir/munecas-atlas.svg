<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title description">
  <title id="title">Ilustracion original NOIR: Muñequeras Atlas</title>
  <desc id="description">Ilustracion vectorial editorial de Muñequeras Atlas; referencia visual, no fotografia del producto.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27232a"/><stop offset=".55" stop-color="#121115"/><stop offset="1" stop-color="#09090b"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#976447" stop-opacity=".42"/><stop offset="1" stop-color="#976447" stop-opacity="0"/></radialGradient>
    <linearGradient id="material" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#976447"/><stop offset=".42" stop-color="#171519"/><stop offset=".78" stop-color="#28232a"/><stop offset="1" stop-color="#976447" stop-opacity=".7"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="900" height="1100" fill="url(#background)"/><ellipse cx="500" cy="477" rx="380" ry="400" fill="url(#halo)"/>
  <path d="M72 85h756M72 1015h756" stroke="#dfd3dc" stroke-opacity=".18"/><path d="M96 83v18m708-18v18M96 999v18m708-18v18" stroke="#c18ba0" stroke-opacity=".65"/>
  <text x="96" y="144" fill="#c6a7b4" font-family="Arial,sans-serif" font-size="15" letter-spacing="5">NOIR  /  EDITORIAL OBJECT 12</text>
  <ellipse cx="450" cy="774" rx="220" ry="32" fill="#000" opacity=".55" filter="url(#shadow)"/>
  <g stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-13 355 430)"><rect class="item" x="277" y="276" width="150" height="294" rx="36"/><path class="shine" d="M289 300h126M289 545h126"/><rect class="item-line" x="285" y="345" width="134" height="27" rx="7"/><rect class="item-line" x="285" y="476" width="134" height="27" rx="7"/><circle class="metal" cx="352" cy="357" r="8"/></g><g transform="rotate(13 545 430)"><rect class="item" x="473" y="276" width="150" height="294" rx="36"/><path class="shine" d="M485 300h126M485 545h126"/><rect class="item-line" x="481" y="345" width="134" height="27" rx="7"/><rect class="item-line" x="481" y="476" width="134" height="27" rx="7"/><circle class="metal" cx="548" cy="357" r="8"/></g></g>
  <text x="96" y="894" fill="#f5f1ed" font-family="Georgia,serif" font-size="43">Muñequeras Atlas</text>
  <text x="98" y="936" fill="#ad9fa7" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">ARNESES Y ACCESORIOS</text>
  <text x="98" y="985" fill="#817880" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">ILUSTRACION ORIGINAL · NO ES UNA FOTOGRAFIA</text>
  <style>
    .item{fill:url(#material);stroke:#e8dce2;stroke-opacity:.48;stroke-width:3;filter:drop-shadow(0 22px 24px #0009)}
    .item-line{fill:none;stroke:url(#material);stroke-width:20;filter:drop-shadow(0 16px 17px #0009)}
    .ghost{fill:#171519;stroke:#bca9b2;stroke-opacity:.22;stroke-width:2}
    .shine{fill:none;stroke:#f6e9ef;stroke-opacity:.5;stroke-width:3}
    .metal{fill:#c9b9c1;stroke:#f3e9ed;stroke-width:2}
  </style>
</svg>