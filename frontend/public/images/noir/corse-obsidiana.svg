  <ellipse cx="450" cy="774" rx="220" ry="32" fill="#000" opacity=".55" filter="url(#shadow)"/>
  <g stroke-linecap="round" stroke-linejoin="round"><path class="item" d="M378 219q72 42 144 0l-14 357q-58 48-116 0z"/><path class="shine" d="M381 229q69 37 138 0M408 569q42 22 84 0M450 239v328M389 291h122M387 342h126M385 394h130M383 446h134M381 498h138"/><circle class="metal" cx="419" cy="291" r="3.5"/><circle class="metal" cx="481" cy="291" r="3.5"/><circle class="metal" cx="419" cy="355" r="3.5"/><circle class="metal" cx="481" cy="355" r="3.5"/><circle class="metal" cx="419" cy="419" r="3.5"/><circle class="metal" cx="481" cy="419" r="3.5"/><circle class="metal" cx="419" cy="483" r="3.5"/><circle class="metal" cx="481" cy="483" r="3.5"/></g>
