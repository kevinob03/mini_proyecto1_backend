  <ellipse cx="450" cy="774" rx="220" ry="32" fill="#000" opacity=".55" filter="url(#shadow)"/>
  <g stroke-linecap="round" stroke-linejoin="round"><path class="item" d="M395 172h110v45H395zM395 217h110l44 54 74 86-40 40-62-57 16 105-48 94H411l-48-94 16-105-62 57-40-40 74-86z"/><path class="shine" d="M396 194h108M406 224l42 53 46-53M333 292l67 52M567 292l-67 52M398 358h104"/></g>
